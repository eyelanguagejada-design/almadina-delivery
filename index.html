<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليفري المدينة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليفري المدينة">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f6fb; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
            align-items: center; justify-content: center; color: #555;
            font-family: system-ui, sans-serif; transition: opacity .3s; }
  #loader img { width: 84px; height: 84px; border-radius: 20px; }
  #loader.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="loader"><img src="icons/icon-192.png" alt=""><div>جاري التحميل…</div></div>
  <iframe id="app" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
  // ⬇️ لينك Apps Script بتاعك (لو عملت نشر جديد غيّره هنا)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyKJXtS-GTetGdr-XYtNKu2Vkv6mHESKefW7baIqfWOs7zlbNNMuj77ZSmYD4etcaz1/exec';

  const isInstalled = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  // أول مرة من المتصفح؟ وديه على صفحة التثبيت
  if (!isInstalled && !sessionStorage.getItem('skipInstall') && !location.search.includes('web')) {
    location.replace('install.html');
  }

  const frame = document.getElementById('app');
  frame.onload = () => document.getElementById('loader').classList.add('hide');
  frame.src = APP_URL;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
